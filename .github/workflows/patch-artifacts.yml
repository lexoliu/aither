name: Patch Artifacts

on:
  pull_request:
    paths:
      - patch/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/patch-artifacts.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      # JSON array of APPLY_PATCH_ABORT variants to build, e.g. '["immediate"]'.
      # PRs and manual runs leave it unset and get both variants.
      abort_variants:
        type: string
        required: false
        default: '["immediate", "panic"]'
      # Commit to build; empty builds the triggering commit.
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # GNU bash for the platforms that run terminal scripts through it; Windows
  # has none. Each target builds on a runner of its own architecture.
  bash:
    name: bash / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build bash
        timeout-minutes: 20
        run: patch/build-bash.sh "${{ matrix.target }}" "${{ runner.temp }}/bash-artifacts"
      - name: Verify archive checksum
        working-directory: ${{ runner.temp }}/bash-artifacts
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
      - name: Verify the packaged executable runs
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bash-check"
          tar -xzf "${RUNNER_TEMP}"/bash-artifacts/bash-*.tar.gz -C "${RUNNER_TEMP}/bash-check"
          "${RUNNER_TEMP}/bash-check/bash" --noprofile --norc -c '[[ "$BASH_VERSION" == 5.3.* ]] && echo "$BASH_VERSION"'
      - uses: actions/upload-artifact@v4
        with:
          name: bash-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bash-artifacts/*.tar.gz
            ${{ runner.temp }}/bash-artifacts/*.sha256
            ${{ runner.temp }}/bash-artifacts/*.json

  artifact:
    name: ${{ matrix.target }} / ${{ matrix.abort }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64, windows-aarch64]
        # inputs is empty on pull_request/workflow_dispatch, where the
        # fallback keeps both abort variants.
        abort: ${{ fromJSON(inputs.abort_variants || '["immediate", "panic"]') }}
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - platform: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: patch-${{ matrix.target }}-${{ matrix.abort }}
      - name: Build rebuilt-std executable
        timeout-minutes: 20
        env:
          APPLY_PATCH_ABORT: ${{ matrix.abort }}
          APPLY_PATCH_NIGHTLY: nightly-2026-10-01
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: patch/build-artifact.sh "${{ matrix.target }}" "${{ runner.temp }}/patch-artifacts"
      - name: Verify the exact artifact
        timeout-minutes: 5
        env:
          APPLY_PATCH_TEST_BIN: ${{ runner.temp }}/patch-artifacts/build/${{ matrix.target }}/apply-patch/apply_patch${{ matrix.suffix }}
        run: cargo +stable test --locked -p aither-patch --test e2e
      - uses: ./.github/actions/install-heel
      - name: Verify Windows native sandbox launch
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          & "$env:HEEL_BIN" run --network deny --keep-working-dir --working-dir "$env:RUNNER_TEMP" -- cmd.exe /D /S /C "echo native-sandbox-ready"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify sandbox file permissions
        timeout-minutes: 5
        run: bash patch/verify-sandbox.sh "${{ runner.temp }}/patch-artifacts/build/${{ matrix.target }}/apply-patch/apply_patch${{ matrix.suffix }}"
      - name: Verify archive checksum
        working-directory: ${{ runner.temp }}/patch-artifacts
        run: |
          if [[ "${RUNNER_OS}" == Windows ]]; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apply-patch-${{ matrix.target }}-${{ matrix.abort }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/patch-artifacts/*.tar.gz
            ${{ runner.temp }}/patch-artifacts/*.sha256
            ${{ runner.temp }}/patch-artifacts/*.json
