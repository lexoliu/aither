name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    # release-plz/git-config reads GITHUB_TOKEN to name the bot committer, and
    # both release-plz commands take it, so it is a job-level variable.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      patch-tag: ${{ steps.patch-release.outputs.tag }}
      patch-version: ${{ steps.patch-release.outputs.version }}
      patch-released: ${{ steps.patch-release.outputs.released }}
    steps:
      # Check out the branch rather than the pushed commit: release-plz runs
      # `git rev-parse @{upstream}`, which needs a branch with an upstream.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      # `cargo publish` verifies each tarball by compiling it; aither-search
      # builds lance/prost, which needs protoc. CI installs it too.
      - uses: arduino/setup-protoc@v3
      # Our own builds — release-pr's semver-check rustdoc and every crate's
      # publish verification — share the ci-ubuntu cache: CI keeps it warm
      # between releases, a release-scoped key would go cold and never hit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      # The water-rs fork of release-plz (from release-plz-v0.3.161, the
      # version release-plz-action@v0.5 pins) treats a package it cannot
      # compare with the registry as changed instead of aborting the whole
      # run. Stock release-plz walks back to the commit that last touched a
      # crate and runs `cargo package` there; older commits of this workspace
      # referenced sibling checkouts by path, so that packaging fails and the
      # release never gets past the first crate.
      # The fork ships no binaries, so build-release-tools.yml compiles each
      # revision once and hosts the tarball on the `devtools` release — the
      # Actions cache cannot hold it across the weeks between releases.
      # After a fork rebase, run that workflow with the new rev, then bump it
      # here.
      - name: Install release-plz (prebuilt)
        env:
          REV: cc554a52e97e0ee359e45c7801d770895247cf27
        run: |
          set -euo pipefail
          asset="release-plz-${REV}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/devtools"
          curl -fsSL "${base}/${asset}" -o "${RUNNER_TEMP}/${asset}"
          curl -fsSL "${base}/${asset}.sha256" -o "${RUNNER_TEMP}/${asset}.sha256"
          cd "${RUNNER_TEMP}"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}" -C "${CARGO_HOME}/bin"
          release-plz --version
      - uses: release-plz/git-config@v0.1.2
      - name: Open or update the release pull request
        run: >-
          release-plz release-pr
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
      # main only accepts merges from dev whose CI went green, but publishing
      # still waits for this exact commit's own checks: the ruleset is the
      # gate, this wait is what makes the release follow the tested commit
      # rather than whatever push happened to land. This job's own check run
      # is excluded so it cannot wait on itself.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 5400 ))
          # Outside the checkout: `cargo publish` refuses a dirty package dir,
          # and the root crate's package dir is the repository root.
          checks_file="${RUNNER_TEMP}/checks.tsv"
          while :; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != "Release") | [.name, (.conclusion // "pending")] | @tsv' \
              > "${checks_file}"
            if [ ! -s "${checks_file}" ]; then
              echo "no check runs on ${GITHUB_SHA} yet"
            elif grep -E $'\t(failure|cancelled|timed_out|action_required|startup_failure|stale)$' "${checks_file}"; then
              echo "::error::a check on ${GITHUB_SHA} did not pass (see list above)"
              exit 1
            elif ! grep -q $'\tpending$' "${checks_file}"; then
              echo "all checks on ${GITHUB_SHA} passed"
              exit 0
            fi
            if [ "$(date +%s)" -gt "${deadline}" ]; then
              echo "::error::timed out waiting for checks on ${GITHUB_SHA}"
              cat "${checks_file}"
              exit 1
            fi
            sleep 30
          done
      # Every crate in this workspace has a Trusted Publishing configuration
      # pointing at this workflow, so crates.io mints a short-lived token from
      # the GitHub OIDC token and no CARGO_REGISTRY_TOKEN secret is needed.
      # crates.io refuses to mint tokens for `workflow_run` runs, which is why
      # this workflow fires on the main push itself. The token expires ~30
      # minutes after minting, so it is minted here — after the CI wait —
      # rather than at the top of the job, or the wait would burn its TTL.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish unpublished packages
        run: >-
          release-plz release
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      # release-plz tags the commit it released — this job's checkout — so a
      # patch-v<version> tag resolving to GITHUB_SHA means this run cut the
      # aither-patch release; an earlier release's tag points at the commit
      # that cut it and does not retrigger asset publishing. The GitHub
      # release is checked rather than assumed (release-plz creates it with
      # the tag).
      - name: Detect the aither-patch release
        id: patch-release
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "aither-patch") | .version')"
          tag="patch-v${version}"
          released=false
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null || true)" = "${GITHUB_SHA}" ] \
              && gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            released=true
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "released=${released}"
          } >> "${GITHUB_OUTPUT}"

  # Rebuilt-std `apply_patch` binaries ship as assets on the patch-v<version>
  # GitHub release, next to the tool-distribution manifest may's initializer
  # consumes (aither #104/#113). The PR-time build+verify matrix is reused
  # through workflow_call, restricted to the `immediate` abort variant that
  # is the published executable.
  apply-patch-artifacts:
    needs: release-plz
    if: needs.release-plz.outputs.patch-released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/patch-artifacts.yml
    with:
      abort_variants: '["immediate"]'

  publish-patch-assets:
    name: Publish apply_patch assets
    needs: [release-plz, apply-patch-artifacts]
    if: needs.release-plz.outputs.patch-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-plz.outputs.patch-tag }}
      VERSION: ${{ needs.release-plz.outputs.patch-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apply-patch-*-immediate
          path: artifacts
          merge-multiple: true
      - name: Build the tool-distribution manifest
        run: >-
          patch/build-manifest.sh artifacts "${TAG}" "${GITHUB_REPOSITORY}"
          > "tool-distribution-${VERSION}.json"
      # Every sha256 is 64 lowercase hex, and apply_patch coverage must span
      # the same (os, arch) set the pinned third-party entries do — the
      # expected targets come from that data file, not a duplicated list.
      - name: Validate the manifest and staged assets
        run: |
          set -euo pipefail
          manifest="tool-distribution-${VERSION}.json"
          jq -e --slurpfile third_party patch/third-party-tools.json '
            ([.artifacts[].sha256] | all(test("^[0-9a-f]{64}$"))) and
            ([.artifacts[] | select(.tool == "apply_patch") | .target] | sort
              == ($third_party[0].artifacts | map(.target) | unique | sort))
          ' "${manifest}" > /dev/null
          for meta in artifacts/apply_patch-*.json; do
            file="$(jq -r .file "${meta}")"
            [ -f "artifacts/${file}" ] && [ -f "artifacts/${file}.sha256" ] \
              || { echo "missing staged asset for ${file}" >&2; exit 1; }
          done
      - name: Upload release assets
        run: >-
          gh release upload "${TAG}" --clobber
          artifacts/*.tar.gz artifacts/*.sha256
          "tool-distribution-${VERSION}.json"
