name: Test

on:
  workflow_call:
    inputs:
      flags:
        description: Cargo flags selecting packages and features to test.
        required: true
        type: string
      cache-key:
        description: >-
          Short label distinguishing this run's cache. Kept separate from
          `flags` because a GitHub cache key may not contain commas or spaces.
        required: true
        type: string
      os:
        description: JSON array of runners to test on.
        required: true
        type: string
      filterset:
        description: >-
          Nextest filterset naming the affected packages, empty to run every
          test. It narrows what runs, never what is built, so the build keeps
          the `flags` feature resolution the saved caches were built with.
        required: false
        default: ''
        type: string
      free-disk:
        description: Reclaim runner disk before building. Ubuntu only.
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide the others: a sandbox that behaves
      # differently on Linux than on macOS is exactly what this matrix is for,
      # and cancelling the rest throws that signal away.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        if: ${{ inputs.free-disk && runner.os == 'Linux' }}
        run: |
          # A hosted runner has ~14 GB free, and this workspace needs more than
          # that once lancedb, ONNX Runtime and llama.cpp are in the graph.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          shared-key: test-${{ matrix.os }}-${{ inputs.cache-key }}
      - uses: ./.github/actions/install-protoc
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/install-heel
      # The pinned tool artifacts and prepared runtimes the sandbox tests use.
      - id: tools
        uses: ./.github/actions/restore-tool-cache
        with:
          rustc: true
          files: |
            patch/third-party-tools.json
            agent/templates/test_baseline_tool.rs
            agent/src/test_support.rs
      - shell: bash
        env:
          FILTERSET: ${{ inputs.filterset }}
        run: cargo nextest run ${{ inputs.flags }} ${FILTERSET:+--no-tests=pass -E "$FILTERSET"}
      # cargo test never ran proc-macro doctests; keep aither-derive excluded so
      # this step covers exactly the doctests the previous job did.
      - run: cargo test --doc ${{ inputs.flags }} --exclude aither-derive
      - if: success() && steps.tools.outputs.hit != 'true' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.tools.outputs.path }}
          key: ${{ steps.tools.outputs.key }}
