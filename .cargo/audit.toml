# cargo-audit configuration.
#
# Kept at the tool level rather than as an input to the CI action, so a local
# `cargo audit` and the CI job reach the same verdict. An exception that only
# exists in a workflow file is one a developer cannot reproduce.

[advisories]
ignore = [
    # `paste` is unmaintained (the author archived it), not vulnerable. It
    # reaches us four levels down through LanceDB
    # (paste <- lance-bitpacking <- lance <- lance-namespace-impls <- lancedb)
    # so we cannot swap it: `pastey` is the maintained fork, but it is a
    # different crate name, which `[patch]` cannot substitute — lance-bitpacking
    # has to adopt it upstream. Its latest release, 10.0.0, still declares
    # `paste ^1`, and lancedb 0.37.1 is already the newest version, so there is
    # no upgrade that avoids it either.
    #
    # Ignoring it is a judgement that an archived proc-macro this small carries
    # no meaningful risk, not that the advisory is wrong. Revisit if LanceDB
    # moves to `pastey`, at which point this line should be deleted.
    "RUSTSEC-2024-0436",

    # `zstd` 0.13.3 / `zstd-safe` 7.3.0 reach us through LanceDB
    # (zstd <- arrow-ipc 58 / lance-encoding 13 <- lance <- lancedb 0.40).
    # The fixes are in zstd 0.14.3 / zstd-safe 8.2.0, but every arrow-ipc
    # 58.x requires `zstd ^0.13` and lancedb 0.40.0, the newest release, still
    # requires `arrow ^58`, so no upgrade removes them.
    #
    # None of the affected entry points is reachable: arrow-ipc calls only
    # `zstd::bulk`, lance-encoding only `bulk`, `stream::copy_decode` and
    # `Encoder::new`. 0391 is `raw::{Encoder, Decoder}::with_context`, 0398
    # needs the `seekable` feature (not enabled), and 0403 is the write-side
    # `stream::write::Decoder`. Delete these lines once lancedb moves to
    # arrow 60, which requires `zstd ^0.14`.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
