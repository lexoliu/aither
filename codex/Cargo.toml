[package]
name = "aither-codex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ChatGPT Codex provider integration for aither (OAuth + subscription Responses backend)"
readme = "../README.md"
keywords = ["ai", "llm", "openai", "chatgpt", "codex"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
aither-models.workspace = true
aither-openai.workspace = true
async-io = "2"
async-lock = "3"
async-stream = "0.3"
base64 = "0.23"
futures-core = { version = "0.3", default-features = false }
futures-lite = "2.6"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
url = { version = "2.5", default-features = false }
zenwave = { workspace = true, features = ["default"] }

[lints]
workspace = true
