[package]
name = "aither-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terminal-first command execution with heel sandboxing"
readme = "../README.md"
keywords = ["sandbox", "agent", "tooling", "terminal"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true

# Sandboxing
heel = "0.5"
rmp-serde = "1"

# Executor for tokio integration
executor-core = { version = "0.7", features = ["tokio"] }

# Async runtime
async-fs = "2"
async-process = "2"
async-io = "2"
bollard = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"

# Process control (for killing background tasks)
libc = "0.2"

# Utilities
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
futures-lite = "2.6"
async-channel = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
strsim = "0.11.1"
human-hash = "0.4"
askama = "0.16"
shell-words = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Output compression: content detection + code folding.
# `magika` links ONNX Runtime, so it is opt-in: running bash in a sandbox
# should not require an ML runtime to be present at link time.
magika = { version = "1.1", optional = true }
# Both are only referenced under `code-folding`, and building them means
# compiling 22 tree-sitter grammars from C, so they follow the feature too.
tree-sitter = { version = "0.22.6", optional = true }
rs-tree-sitter-languages = { version = "0.0.2", optional = true }
vte = { version = "0.15", default-features = false, features = ["std"] }
sha2 = "0.11"
blocking = "1.7.0"
futures = "0.3.34"
tempfile = "3.27.0"
hex = "0.4.3"
semver = { version = "1.0.28", features = ["serde"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zenwave = { workspace = true, features = ["hyper-backend", "rustls"] }
url = { version = "2.5.8", features = ["serde"] }
procfs-core = { version = "0.18.0", default-features = false }
fd-lock = "4"
typed-path = "0.12.3"

[features]
default = []
# Detect source code in command output so it can be folded with tree-sitter.
# Pulls in ONNX Runtime via `magika`.
code-folding = ["dep:magika", "dep:tree-sitter", "dep:rs-tree-sitter-languages"]

[dev-dependencies]
magika = { version = "1", features = ["_test"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
