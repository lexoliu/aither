[package]
name = "aither-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core trait abstractions for aither"
readme = "../README.md"
keywords = ["ai", "llm", "traits", "no-std"]
categories = ["api-bindings", "no-std"]

[dependencies]
aither-derive = { workspace = true, optional = true}
anyhow = { version = "1.0", default-features = false }
askama = { version = "0.16", default-features = false, features = ["alloc", "derive"] }
futures-core = { version = "0.3.34", default-features = false}
futures-lite = { version = "2.6"}
httpdate = { version = "1.0", optional = true }
mime = "0.3"
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false}
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
url = { version = "2.5", default-features = false }
zenwave = { workspace = true, optional = true, features = ["hyper-backend", "rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = { version = "2.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
async-channel = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"
schemars = { version = "1.2" }
serde = { version = "1.0", features = ["derive"] }
futures-lite = { version = "2.6"}

[features]
default = ["derive", "serde"]
serde = ["serde/derive","url/serde"]
derive = ["aither-derive"]
# HTTP failure classification for providers built on zenwave.
zenwave = ["dep:zenwave", "dep:httpdate"]
# A runtime-agnostic `time::sleep` that also runs on wasm32.
timer = ["dep:async-io", "dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:async-channel"]

[lints]
workspace = true
