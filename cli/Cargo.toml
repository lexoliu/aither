[package]
name = "aither-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Interactive CLI for testing aither agents"
readme = "../README.md"
keywords = ["ai", "agent", "llm", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "aither"
path = "src/main.rs"

[dependencies]
aither-acp.workspace = true
aither-agent = { workspace = true, default-features = true, features = ["full"] }
aither-cloud.workspace = true
aither-core.workspace = true
aither-mcp.workspace = true
anyhow = "1.0"
async-lock = "3"
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
arc-swap = "1.9"
dirs = "7.0"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "fs"] }
executor-core = { version = "0.7", features = ["tokio"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lints]
workspace = true
