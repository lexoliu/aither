[package]
name = "aither-apple"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Apple Intelligence on-device language model integration for aither"
readme = "README.md"
keywords = ["ai", "llm", "apple", "foundation-models", "on-device"]
categories = ["api-bindings"]
build = "build.rs"
links = "aither-apple"

[package.metadata.docs.rs]
# The public API must document on docs.rs' Linux builders: build.rs skips the
# native bridge when DOCS_RS is set.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aither-core.workspace = true
async-channel = "2"
async-fs = "2"
data-url = "0.3"
futures-util = "0.3"
futures-lite = "2.6"
mime = "0.3"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2"
zenwave = { workspace = true, features = ["default"] }

[dev-dependencies]
futures-lite = "2.6"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[features]
# Deterministic FoundationModels executors for OS 27 correctness tests only.
test = []

[lints]
workspace = true
