[workspace]
pr_draft = false
changelog_config = "cliff.toml"
pr_labels = ["release"]
git_release_name = "{{ crate_name }}-v{{ version }}"
commit_message = "chore(release): {{ crate_name }} v{{ version }} [skip ci]"
publish = true
git_tag_enable = true
changelog_update = true

# Every workspace member is released. release-plz works out the publish order from
# the dependency graph, so these entries only fix each crate's tag name -- omitting
# one gives it a tag inconsistent with the rest rather than holding it back.

[[package]]
name = "aither"
path = "."
git_tag_name = "v{{ version }}"

[[package.files_to_update]]
path = "README.md"
search = 'aither = "[0-9]+\.[0-9]+(\.[0-9]+)?"'
replace = 'aither = "{{ version }}"'

[[package]]
name = "aither-acp"
path = "acp"
git_tag_name = "acp-v{{ version }}"

