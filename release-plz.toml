[workspace]
pr_draft = false
pr_labels = ["release"]
git_release_name = "{{ crate_name }}-v{{ version }}"
publish = true
git_tag_enable = true
changelog_update = true

# Every workspace member is released. release-plz works out the publish order from
# the dependency graph, so these entries only fix each crate's tag name -- omitting
# one gives it a tag inconsistent with the rest rather than holding it back.
#
# Only the fields in release-plz's own schema belong here: it rejects the file
# outright on an unknown key rather than ignoring it, and the release job is the
# one place where that is not discovered until a release is being cut. Check a
# change against the version the action pins, with `release-plz generate-schema`.

[[package]]
name = "aither"
git_tag_name = "v{{ version }}"

[[package]]
name = "aither-acp"
git_tag_name = "acp-v{{ version }}"

