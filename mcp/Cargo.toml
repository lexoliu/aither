[package]
name = "aither-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) client and server for aither"
readme = "../README.md"
keywords = ["mcp", "tooling", "agent", "protocol"]
categories = ["api-bindings"]

[features]
default = ["client", "server", "http"]
client = ["dep:aither-sandbox"]
server = []
http = ["client", "dep:zenwave"]

[dependencies]
aither-core.workspace = true
aither-sandbox = { workspace = true, optional = true }
zenwave = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
thiserror = "2"
async-io = "2"
async-process = "2"
async-lock = "3"
tracing = "0.1"

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
