[package]
name = "aither-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) client and server for aither"
readme = "../README.md"
keywords = ["mcp", "tooling", "agent", "protocol"]
categories = ["api-bindings"]

[features]
default = ["client", "server", "http"]
client = ["dep:aither-sandbox"]
server = []
http = ["client", "dep:zenwave"]

[dependencies]
aither-core.workspace = true
aither-sandbox = { workspace = true, optional = true }
# `hyper-rustls` rather than the workspace default: `default-backend` also
# enables `native-tls`, and a crate consumed by a cross-compiled daemon must
# not drag openssl-sys into its feature-unified graph.
zenwave = { workspace = true, optional = true, default-features = false, features = ["hyper-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
mime = "0.3"
futures-lite = "2"
async-channel = "2"
thiserror = "2"
# Drives stdin/stdout on blocking threads; see transport::stdio.
blocking = "1"
async-process = "2"
async-lock = "3"
# FuturesUnordered + Abortable for concurrent tools/call; see server.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"

[[example]]
name = "context7"
required-features = ["http"]

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
