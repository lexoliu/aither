[package]
name = "aither-mem0"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mem0-style long term memory orchestrator for Aither agents"
readme = "../README.md"
keywords = ["memory", "agent", "llm", "rag", "long-term-memory"]
categories = ["api-bindings", "ai"]

[dependencies]
aither-core.workspace = true
anyhow = { version = "1.0", features = ["std"] }
async-global-executor = "3"
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
thiserror = "2.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
tracing.workspace = true
async-channel = "2.5"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros"] }
aither-openai.workspace = true
aither-gemini.workspace = true

[lints]
workspace = true
