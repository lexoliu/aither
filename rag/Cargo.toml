[package]
name = "aither-rag"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Production-ready RAG with HNSW indexing, chunking, and persistence"
keywords = ["rag", "embedding", "vector-database", "search", "hnsw"]
categories = ["api-bindings", "database"]

[dependencies]
aither-core.workspace = true
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
schemars = { version = "1.2", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"

# Chunking
unicode-segmentation = "1.13"
# Pinned to 0.22: `rs-tree-sitter-languages` (used by aither-sandbox) links the
# native `tree-sitter` library at this version, and Cargo permits only one
# package in the graph to set `links = "tree-sitter"`.
tree-sitter = "0.22.6"
tree-sitter-rust = "0.21.2"

# HNSW Index
instant-distance = "0.6.1"
arc-swap = "1.9"
ordered-float = "5.4"

# Persistence
rkyv = { version = "0.8", features = ["bytecheck"] }
redb = "2.6"
# `remote` is required even for local-only use: lancedb 0.40's `job.rs`
# references `Error::Http` unconditionally, so the crate does not compile
# without it.
lancedb = { version = "0.40", default-features = false, features = ["remote"], optional = true }
# Must match the arrow version `lancedb` links against, or the RecordBatch
# types are nominally distinct and its traits do not apply.
arrow-array = { version = "58.4", optional = true }
arrow-schema = { version = "58.4", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread"], optional = true }

# Deduplication
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]
default = []
lancedb-persistence = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3.27"

[lints]
workspace = true
