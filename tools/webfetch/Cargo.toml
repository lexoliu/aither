[package]
name = "aither-webfetch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Web content fetching and HTML-to-Markdown conversion"
readme = "../../README.md"
keywords = ["web", "fetch", "markdown", "async", "scraping"]
categories = ["web-programming"]

[dependencies]
aither-core.workspace = true
anyhow = "1.0"
htmd = "0.5"
dom_smoothie = "0.18"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
url = "2.5.8"
zenwave = { workspace = true, features = ["default"] }
tracing.workspace = true
regex = "1.13"
html-escape = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
# Resolver used by the SSRF guard to check where a host actually points.
async-net = "2"

# Image processing for format conversion
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Headless browser support (optional) - tokio comes via chromiumoxide
# `fetcher` (and its TLS/zip features) is deliberately off: we drive a browser
# that is already installed rather than downloading one.
chromiumoxide = { version = "0.9", optional = true, default-features = false, features = ["bytes"] }
futures-lite = { version = "2.6", optional = true }
tokio = { version = "1.53", optional = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
futures-lite = "2.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
headless = ["dep:chromiumoxide", "dep:futures-lite", "dep:tokio"]

[[example]]
name = "headless"
required-features = ["headless"]
