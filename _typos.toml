[default]
# These exact snapshot pairs test truncation and revision rejection; their
# intentionally incomplete words must remain unchanged to exercise those cases.
extend-ignore-re = ['\bdelta\("hello", "hel"\)', '\bdelta\("abc", "abd"\)']

# `paht` is a deliberate transposition in a sandbox test that asserts the
# "Did you mean --path?" suggestion fires. Correcting it would delete the case
# the test exists to cover.
[default.extend-words]
paht = "paht"
