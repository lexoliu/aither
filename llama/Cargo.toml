[package]
name = "aither-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local llama.cpp provider integration for aither"
readme = "../README.md"
keywords = ["ai", "llm", "llama", "llama.cpp", "embedding"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
async-channel = "2"
async-fs = "2"
futures-core = { version = "0.3", default-features = false }
futures-lite = "2.6"
encoding_rs = "0.8"
# Pinned exactly: 0.1.154 dropped `apply_chat_template_oaicompat`, which is what
# carries the thinking toggle and the model-side tool-call parser used below.
llama-cpp-2 = { version = "=0.1.133", features = ["sampler"] }
# llama-cpp-2 0.1.133 asks for `llama-cpp-sys-2 = "0.1.133"`, but that caret range
# also admits 0.1.154, whose bindings no longer export the oaicompat wrappers 0.1.133
# calls. Pin the sys crate so a fresh resolve cannot pick that broken pair.
llama-cpp-sys-2 = "=0.1.133"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

# Pinned to force the matching sys version; nothing references it directly.
[package.metadata.cargo-machete]
ignored = ["llama-cpp-sys-2"]

[lints]
workspace = true
