[package]
name = "aither-claude"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Claude provider integration for aither"
readme = "../README.md"
keywords = ["ai", "llm", "claude", "anthropic"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
aither-models.workspace = true
async-stream = "0.3"
base64 = "0.23"
futures-core = { version = "0.3", default-features = false }
futures-lite = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
zenwave.workspace = true

# The file:// attachment reader is native-only; wasm32 has no filesystem.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-fs = "2"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

[lints]
workspace = true
