[package]
name = "aither-openai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI provider integration for aither"
readme = "../README.md"
keywords = ["ai", "llm", "openai", "chatgpt"]
categories = ["api-bindings"]

[dependencies]
aither-core.workspace = true
aither-models.workspace = true
aither-attachments.workspace = true
async-stream = "0.3"
futures-core = { version = "0.3", default-features = false }
futures-lite = "2.6"
base64 = "0.23"
mime_guess = "2"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
url = "2"
zenwave = { workspace = true, features = ["default"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = "2"
async-fs = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"
async-channel = "2"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

[lints]
workspace = true
